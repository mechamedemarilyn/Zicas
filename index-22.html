<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff9dce"><title>IA para Educadores · Y2K Studio</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

:root{font-family:'DM Sans',system-ui,sans-serif;color:#2c2340;background:#ece7f5;--ink:#211a34;--purple:#4b326f;--violet:#7557a8;--lav:#b7a4d8;--cream:#faf6ed;--pink:#e9a9cc;--blue:#9db5d8;--sage:#a9b88b;--yellow:#efd46e;--line:#d9d0e4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#e9e4ef,#f4efe7 48%,#e5def0);background-attachment:fixed}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:26px 22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;background:linear-gradient(115deg,#34244f,#533a78 58%,#745a9b);border:1px solid #806aa1;border-radius:28px;padding:27px 30px;box-shadow:0 16px 36px #37265035;position:relative;overflow:hidden}.top:after{content:'✦  ✧';position:absolute;right:28px;bottom:-8px;font-size:54px;letter-spacing:10px;color:#e6d8ff26}.top>div,.top .pill{position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:.18em;color:#d8c8ef;font-weight:800;text-transform:uppercase}h1,h2,.metric .number{font-family:'Space Grotesk','DM Sans',sans-serif}h1{margin:6px 0 2px;font-size:clamp(27px,4vw,42px);letter-spacing:-.055em;color:#fff}h2{font-size:18px;margin:0 0 15px;color:#302348}p{color:#675d72;line-height:1.5}.top .muted{color:#ddd2e9}.muted,small{color:#81778b}.pill{padding:9px 13px;border:1px solid #a38bbf;border-radius:100px;font-size:12px;background:#241b35cc;color:#f5effb;font-weight:800}.tabs{display:flex;gap:9px;overflow:auto;margin:27px 0 20px;padding:5px 2px 9px;scrollbar-width:thin}.tabs button{background:#f9f5ed;color:#665779;border:1px solid #d8cfdf;border-radius:100px;padding:11px 17px;white-space:nowrap;font-weight:800;box-shadow:0 3px 0 #d5cddd;transition:.15s}.tabs button:hover{transform:translateY(-2px)}.tabs button.active{background:#392a55;color:#fff;border-color:#392a55;box-shadow:0 4px 0 #21182f}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.panel,.metric{background:#faf7f1;border:1px solid #d9d0e1;border-radius:24px;padding:20px;box-shadow:0 8px 24px #3e315012}.metric{background:#fffaf1}.metric:nth-child(1){background:linear-gradient(145deg,#3b2b56,#54406f);border-color:#66517f}.metric:nth-child(1) .name,.metric:nth-child(1) small{color:#d9cce8}.metric:nth-child(1) .number{color:#fff}.metric:nth-child(2){background:#eee6f6}.metric:nth-child(3){background:#e6edf5}.metric:nth-child(4){background:#f3e5ed}.metric .number{font-size:31px;font-weight:800;margin:9px 0 2px;letter-spacing:-.055em;color:#4d376c}.metric .name{font-size:12px;color:#655873;font-weight:800}.layout{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}.stack{display:grid;gap:16px}.bar{height:11px;background:#e5dfea;border-radius:20px;overflow:hidden;margin:10px 0}.fill{height:100%;background:linear-gradient(90deg,#7356a5,#b18bc9,#e7a9c9);border-radius:20px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px}.item{padding:13px 0;border-bottom:1px solid #e5dee8}.item:last-child{border:0}.btn{background:#38294f;color:white;border:1px solid #38294f;border-radius:14px;padding:11px 15px;font-weight:800;box-shadow:0 4px 0 #21182f}.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #21182f}.btn.secondary{background:#e8dff1;color:#4c3868;border-color:#cdbedf;box-shadow:0 4px 0 #cfc4da}.btn.danger{background:#f4dce5;color:#9a3e62;border-color:#e4b8c8;box-shadow:0 4px 0 #d9bdc7}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:#5e4d70;font-weight:800}.field input,.field select,.field textarea,select{width:100%;background:#fffdf8;border:1px solid #d7cfe0;color:#3c3149;border-radius:13px;padding:11px;min-height:42px}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #a68ac7;outline-offset:1px}.field textarea{min-height:75px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:flex-start;gap:10px;line-height:1.45}.check input{accent-color:#5e427f;width:18px;height:18px;flex-shrink:0}.section-title{font-weight:800;margin:17px 0 6px;color:#563b75}.tag{font-size:11px;border-radius:100px;background:#ded2ec;padding:6px 10px;color:#50366d;font-weight:800}.empty{border:1px dashed #c9bed3;padding:22px;border-radius:15px;color:#776c80;text-align:center;background:#f6f1f7}.alert{background:#f1d9e7;border:1px solid #e1bed1;border-radius:15px;padding:13px;color:#71495f;font-size:13px}.footer{font-size:12px;color:#81778b;margin:28px 0;text-align:center}.hidden{display:none!important}details{margin-top:15px}summary{cursor:pointer;color:#5d417b;font-weight:800}pre{background:#2b213d!important;color:#eee7f6;border:1px solid #49385f}::selection{background:#c9b1e1;color:#271d36}@media(max-width:740px){.app{padding:12px}.top{padding:21px 18px;border-radius:22px}.top:after{font-size:28px;right:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.metric,.panel{padding:15px;border-radius:19px}.metric .number{font-size:25px}.formgrid{grid-template-columns:1fr}.tabs button{padding:10px 13px;font-size:13px}}
</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">MARILYN SILVA · PROJETO COMERCIAL</div><h1>IA para Educadores</h1><div class="muted">Do portfólio ao primeiro contrato remunerado</div></div><span id="syncStatus" class="pill">Armazenamento local</span></header><nav class="tabs" id="tabs"><button data-tab="dashboard" class="active">Visão geral</button><button data-tab="planner">Planner</button><button data-tab="crm">Instituições</button><button data-tab="financeiro">Financeiro</button><button data-tab="config">Nuvem e dados</button></nav><div id="view"></div><div class="footer">Estimativas orientativas, não probabilidades estatísticas. Valores em reais. Os dados ficam no dispositivo até você ativar a sincronização.</div></main><script type="module">
const KEY='marilyn-ia-educadores-v1';const baseTasks=[['Preparação','Consultar situação cadastral do MEI','2026-10-18'],['Preparação','Verificar DAS, declarações e certidões','2026-10-18'],['Preparação','Verificar contratação como pessoa física','2026-10-18'],['Oferta','Selecionar exemplos do e-book de prompts','2026-10-25'],['Oferta','Montar ementa da oficina de 2 horas','2026-10-25'],['Oferta','Criar apresentação comercial em PDF','2026-10-25'],['Oferta','Preparar demonstração de 5 minutos','2026-10-25'],['Prospecção','Identificar 15 canais ou contatos oficiais','2026-11-15'],['Prospecção','Enviar propostas personalizadas','2026-11-15'],['Prospecção','Consultar editais e credenciamentos','2026-11-15'],['Prospecção','Acompanhar respostas e reuniões','2026-11-15'],['Negociação','Realizar reunião comercial','2026-12-15'],['Negociação','Negociar oficina remunerada','2026-12-15'],['Negociação','Confirmar prazo de pagamento','2026-12-15'],['Execução','Executar capacitação contratada','2026-12-15'],['Recebimento','Emitir documento fiscal exigido','2027-01-15'],['Recebimento','Confirmar aceite do serviço','2027-01-15'],['Recebimento','Conferir pagamento recebido','2027-01-15']];
const initial=()=>({tasks:baseTasks.map((x,i)=>({id:'t'+i,phase:x[0],title:x[1],due:x[2],done:false})),leads:[],payments:[],notes:'Experiência docente com crianças, adolescentes e jovens; treinamentos para adultos; e-book de prompts e projetos de IA.',mei:'desconhecido',target:'2027-01-15',hours:8,updated:new Date().toISOString()});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}let tab='dashboard',sb=null,user=null,remoteReady=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const today=()=>new Date().toISOString().slice(0,10);const days=()=>Math.max(0,Math.ceil((new Date(data.target+'T23:59:59')-new Date())/86400000));const done=()=>data.tasks.filter(t=>t.done).length;const paid=()=>data.payments.filter(p=>p.status==='recebido');const contracted=()=>data.leads.filter(l=>['contratado','realizado','pago'].includes(l.status));const opportunities=()=>data.leads.filter(l=>['proposta','reuniao','negociacao'].includes(l.status));
function estimate(){let score=15;score+=Math.round(8*done()/Math.max(1,data.tasks.length));score+=Math.min(12,data.leads.length*1.5);score+=Math.min(10,opportunities().length*4);score+=Math.min(20,contracted().length*18);score+=data.mei==='regular'?6:data.mei==='pendente'?-4:0;score+=paid().length?35:0;let d=days();if(d<30&&!paid().length)score-=12;else if(d<60&&!paid().length)score-=6;if(d===0&&!paid().length)score=0;if(paid().length)score=100;let central=Math.max(0,Math.min(100,Math.round(score)));return {central,low:paid().length?100:Math.max(0,Math.round(central*.35)),high:paid().length?100:Math.min(95,Math.round(central*2.3))}}
async function save(){data.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));if(sb&&user){const {error}=await sb.from('project_state').upsert({user_id:user.id,payload:data,updated_at:data.updated});$('syncStatus').textContent=error?'Erro de sincronização':'Nuvem sincronizada';}render()}
const progress=(a,b)=>`<div class="bar"><div class="fill" style="width:${Math.min(100,Math.round(a/Math.max(1,b)*100))}%"></div></div>`;
function dashboard(){let e=estimate(),gross=paid().reduce((s,p)=>s+Number(p.amount),0),next=data.tasks.find(t=>!t.done);return `<div class="grid"><div class="metric"><div class="name">Chance central estimada</div><div class="number">${e.central}%</div><small>Receber até 15/01/2027</small></div><div class="metric"><div class="name">Dias restantes</div><div class="number">${days()}</div><small>Meta: ${esc(data.target)}</small></div><div class="metric"><div class="name">Contatos cadastrados</div><div class="number">${data.leads.length}</div><small>${opportunities().length} em negociação</small></div><div class="metric"><div class="name">Recebido</div><div class="number" style="font-size:23px">${money(gross)}</div><small>${paid().length} pagamento(s)</small></div></div><div class="layout"><div class="stack"><section class="panel"><h2>Três cenários</h2>${[['Conservador',e.low],['Provável',e.central],['Otimista',e.high]].map(([x,v])=>`<div class="item"><div class="line"><span>${x}</span><strong>${v}%</strong></div>${progress(v,100)}</div>`).join('')}<small>Modelo heurístico: tarefas, contatos, estágio das negociações, documentação e prazo. Não representa taxa real de contratação.</small></section><section class="panel"><h2>Andamento por etapa</h2>${[...new Set(data.tasks.map(t=>t.phase))].map(ph=>{let arr=data.tasks.filter(t=>t.phase===ph);return `<div class="item"><div class="line"><span>${esc(ph)}</span><small>${arr.filter(t=>t.done).length}/${arr.length}</small></div>${progress(arr.filter(t=>t.done).length,arr.length)}</div>`}).join('')}</section></div><div class="stack"><section class="panel"><h2>Próxima ação</h2>${next?`<p>${esc(next.title)}</p><small>Prazo: ${esc(next.due)}</small><div style="margin-top:15px"><button class="btn" data-action="complete" data-id="${esc(next.id)}">Marcar como concluída</button></div>`:'<p>Todas as tarefas concluídas.</p>'}</section><section class="panel"><h2>Premissas do projeto</h2><p>Experiência em docência e treinamento de adultos, e-book de prompts, sem rede inicial no Sistema S, orçamento de R$ 0 e disponibilidade de ${esc(data.hours)} horas semanais.</p><div class="alert">O pagamento pode ocorrer após a execução. Para atingir a meta, confirme o prazo financeiro antes de aceitar a proposta.</div></section></div></div>`}
function planner(){return `<div class="panel"><div class="line"><h2>Plano de ação</h2><span class="tag">${done()}/${data.tasks.length} concluídas</span></div>${progress(done(),data.tasks.length)}${[...new Set(data.tasks.map(t=>t.phase))].map(ph=>`<div class="section-title">${esc(ph)}</div>${data.tasks.filter(t=>t.phase===ph).map(t=>`<div class="item"><label class="check"><input type="checkbox" data-action="task" data-id="${esc(t.id)}" ${t.done?'checked':''}><span style="${t.done?'text-decoration:line-through;color:#94a3b8':''}">${esc(t.title)}<br><small>Até ${esc(t.due)}</small></span></label></div>`).join('')}`).join('')}<form id="taskForm" style="margin-top:20px"><h2>Adicionar tarefa</h2><div class="formgrid"><div class="field"><label>Descrição</label><input name="title" required maxlength="180"></div><div class="field"><label>Prazo</label><input type="date" name="due" value="${today()}" required></div></div><button class="btn">Adicionar tarefa</button></form></div>`}
function crm(){return `<div class="layout"><section class="panel"><h2>Instituições e oportunidades</h2>${data.leads.length?data.leads.map(l=>`<div class="item"><div class="line"><strong>${esc(l.name)}</strong><span class="tag">${esc(l.status)}</span></div><p style="margin:6px 0">${esc(l.contact||'Contato não informado')}</p><small>${esc(l.notes||'')} · ${esc(l.date||'Sem data')}</small><div style="margin-top:10px" class="line"><select data-action="leadstatus" data-id="${esc(l.id)}">${['pesquisa','contatado','reuniao','proposta','negociacao','contratado','realizado','pago','perdido'].map(x=>`<option ${l.status===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn danger" data-action="deletelead" data-id="${esc(l.id)}">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhuma instituição cadastrada.</div>'}</section><section class="panel"><h2>Novo contato</h2><form id="leadForm"><div class="field"><label>Instituição / unidade</label><input name="name" required maxlength="120" placeholder="Ex.: Senac - unidade..."></div><div class="field"><label>Contato / e-mail / link</label><input name="contact" maxlength="220"></div><div class="field"><label>Etapa</label><select name="status"><option>pesquisa</option><option>contatado</option><option>reuniao</option><option>proposta</option><option>negociacao</option><option>contratado</option></select></div><div class="field"><label>Próximo contato</label><input name="date" type="date"></div><div class="field"><label>Observações</label><textarea name="notes"></textarea></div><button class="btn">Salvar instituição</button></form></section></div>`}
function financeiro(){let expected=data.payments.filter(p=>p.status!=='recebido').reduce((s,p)=>s+Number(p.amount),0);return `<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="metric"><div class="name">A receber</div><div class="number">${money(expected)}</div></div><div class="metric"><div class="name">Recebido</div><div class="number">${money(paid().reduce((s,p)=>s+Number(p.amount),0))}</div></div></div><div class="layout"><section class="panel"><h2>Propostas e pagamentos</h2>${data.payments.length?data.payments.map(p=>`<div class="item"><div class="line"><strong>${esc(p.client)}</strong><strong>${money(p.amount)}</strong></div><small>Previsão: ${esc(p.due||'não definida')}</small><div class="line" style="margin-top:10px"><select data-action="paystatus" data-id="${esc(p.id)}">${['proposta','contratado','executado','faturado','recebido'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn danger" data-action="deletepay" data-id="${esc(p.id)}">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhuma proposta financeira registrada.</div>'}</section><section class="panel"><h2>Novo valor</h2><form id="paymentForm"><div class="field"><label>Cliente</label><input name="client" required></div><div class="field"><label>Valor (R$)</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Previsão de pagamento</label><input name="due" type="date"></div><div class="field"><label>Status</label><select name="status"><option>proposta</option><option>contratado</option><option>executado</option><option>faturado</option><option>recebido</option></select></div><button class="btn">Salvar valor</button></form></section></div>`}
function config(){return `<div class="layout"><section class="panel"><h2>Configurações do projeto</h2><form id="settingsForm"><div class="field"><label>Situação do MEI</label><select name="mei">${[['desconhecido','Não sei'],['regular','Ativo e regular'],['pendente','Com pendências'],['inativo','Inativo / baixado']].map(([v,l])=>`<option value="${v}" ${data.mei===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Horas disponíveis por semana</label><input name="hours" type="number" min="1" max="60" value="${esc(data.hours)}"></div><div class="field"><label>Meta de recebimento</label><input name="target" type="date" value="${esc(data.target)}"></div><div class="field"><label>Notas sobre sua experiência</label><textarea name="notes">${esc(data.notes)}</textarea></div><button class="btn">Salvar configurações</button></form><h2 style="margin-top:26px">Cópia de segurança</h2><div class="line" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn secondary" id="export">Exportar JSON</button><label class="btn secondary" style="cursor:pointer">Importar JSON<input id="import" type="file" accept="application/json" hidden></label></div></section><section class="panel"><h2>Sincronização na nuvem</h2><p>Conecte um projeto gratuito do Supabase para salvar seus dados em uma tabela privada, com login por e-mail.</p><div class="alert">Sem configuração, o app salva apenas neste navegador. Nunca compartilhe a chave secreta/service_role; use somente a chave pública anon/publishable.</div><form id="cloudForm" style="margin-top:16px"><div class="field"><label>Supabase Project URL</label><input name="url" type="url" placeholder="https://...supabase.co" value="${esc(localStorage.getItem('sb-url')||'')}"></div><div class="field"><label>Chave pública anon / publishable</label><input name="key" placeholder="sb_publishable_..." value="${esc(localStorage.getItem('sb-key')||'')}"></div><div class="field"><label>E-mail de acesso</label><input name="email" type="email" placeholder="seu@email.com" value="${esc(localStorage.getItem('sb-email')||'')}"></div><button class="btn">Conectar / enviar link de acesso</button></form><div style="margin-top:14px"><button class="btn secondary" id="pull">Carregar dados da nuvem</button></div><p id="cloudMessage" class="muted"></p><details><summary>Como preparar o Supabase (SQL)</summary><p>Crie um projeto e execute este SQL no SQL Editor. Ative autenticação por e-mail e configure a URL do app nas URLs de redirecionamento.</p><pre style="overflow:auto;font-size:11px;background:#0b1120;padding:12px;border-radius:9px"><code>${esc(SQL)}</code></pre><button class="btn secondary" id="copySQL">Copiar SQL</button></details></section></div>`}
const SQL=`create table if not exists public.project_state (user_id uuid primary key references auth.users(id) on delete cascade, payload jsonb not null, updated_at timestamptz default now());\nalter table public.project_state enable row level security;\ncreate policy "read own" on public.project_state for select to authenticated using (auth.uid() = user_id);\ncreate policy "insert own" on public.project_state for insert to authenticated with check (auth.uid() = user_id);\ncreate policy "update own" on public.project_state for update to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id);`;
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('view').innerHTML=({dashboard,planner,crm,financeiro,config}[tab])();$('syncStatus').textContent=user?'Nuvem conectada':'Salvo neste dispositivo'}
function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}let a=b.dataset.action,i=b.dataset.id;if(a==='complete'){let t=data.tasks.find(x=>x.id===i);if(t)t.done=true;await save()}if(a==='deletelead'&&confirm('Excluir este contato?')){data.leads=data.leads.filter(x=>x.id!==i);await save()}if(a==='deletepay'&&confirm('Excluir este valor?')){data.payments=data.payments.filter(x=>x.id!==i);await save()}if(b.id==='export'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='ia-educadores-backup.json';link.click();URL.revokeObjectURL(url)}if(b.id==='copySQL')navigator.clipboard.writeText(SQL);if(b.id==='pull')await pull()});
document.addEventListener('change',async e=>{let a=e.target.dataset.action,i=e.target.dataset.id;if(a==='task'){let t=data.tasks.find(x=>x.id===i);if(t)t.done=e.target.checked;await save()}if(a==='leadstatus'){let l=data.leads.find(x=>x.id===i);if(l)l.status=e.target.value;await save()}if(a==='paystatus'){let p=data.payments.find(x=>x.id===i);if(p)p.status=e.target.value;await save()}if(e.target.id==='import'){try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.tasks)||!Array.isArray(obj.leads)||!Array.isArray(obj.payments))throw Error('Formato inválido');if(confirm('Substituir os dados atuais pelos dados importados?')){data=obj;await save()}}catch(err){alert('Não foi possível importar: '+err.message)}}});
document.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));if(f.id==='taskForm')data.tasks.push({id:id(),phase:'Personalizadas',title:v.title,due:v.due,done:false});if(f.id==='leadForm')data.leads.push({id:id(),...v});if(f.id==='paymentForm')data.payments.push({id:id(),...v,amount:Number(v.amount)});if(f.id==='settingsForm'){data.mei=v.mei;data.hours=Number(v.hours);data.target=v.target;data.notes=v.notes}if(f.id==='cloudForm'){localStorage.setItem('sb-url',v.url.trim());localStorage.setItem('sb-key',v.key.trim());localStorage.setItem('sb-email',v.email.trim());await connect(true);return}await save()});
async function connect(send){let url=localStorage.getItem('sb-url'),key=localStorage.getItem('sb-key'),email=localStorage.getItem('sb-email');if(!url||!key||!email)return;try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=createClient(url,key);let {data:auth}=await sb.auth.getUser();user=auth.user;if(send&&!user){let {error}=await sb.auth.signInWithOtp({email,emailRedirectTo:location.origin+location.pathname});if(error)throw error;alert('Confira seu e-mail e abra o link de acesso neste dispositivo.');return}if(user){await pull();}else render()}catch(err){alert('Falha na conexão: '+err.message)}}
async function pull(){if(!sb||!user){alert('Conecte a nuvem e faça login primeiro.');return}const {data:row,error}=await sb.from('project_state').select('payload,updated_at').eq('user_id',user.id).maybeSingle();if(error){alert('Falha ao carregar: '+error.message);return}if(row?.payload){if(new Date(row.updated_at)>new Date(data.updated||0)){data=row.payload;localStorage.setItem(KEY,JSON.stringify(data))}else await save()}else await save();render()}
render();connect(false);</script></body></html>
